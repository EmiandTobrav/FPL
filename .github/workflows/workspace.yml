name: Research workspace checks
on:
  pull_request:
    paths:
      - 'scripts/research.py'
      - 'scripts/test_research.py'
      - 'overview/**'
      - 'datasets/**'
      - '.github/workflows/workspace.yml'
  push:
    branches: [main]
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_research.py
      - run: python scripts/research.py refresh
